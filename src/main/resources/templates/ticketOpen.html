<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
    <style>
        body {
            font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, "Helvetica Neue", "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", sans-serif;
            background-color: #F2F0FF;
        }
        table {
            width: 512px;
            margin: 0 auto;
            background-color: #ffffff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.1);
        }
        h2 {
            font-size: 20px;
            font-weight: 700;
            color: #140f33;
        }
        p {
            font-size: 16px;
            color: #333333;
            line-height: 1.6;
        }
        .footer {
            font-size: 14px;
            color: #686868;
            text-align: center;
            padding-top: 20px;
        }
        .ticket-info {
            font-size: 16px;
            color: #140f33;
            font-weight: 700;
        }
    </style>
</head>
<body>
<div style="padding: 20px; background-color: #F2F0FF;">
    <table>
        <tr>
            <td>
                <img src="https://...(생략).../company_logo.png" style="width: 50px; height: 50px;" alt="Company Logo"/>
                <h2 th:text="|${ticketOpenMessage.userName}님, 티켓 오픈 안내입니다!|"></h2>
            </td>
        </tr>
        <tr>
            <td>
                <p>안녕하세요, <strong th:text="${ticketOpenMessage.userName}"></strong>님!</p>
                <p>고객님이 기다리시던 공연 <strong th:text="${ticketOpenMessage.title}"></strong>의 티켓이 곧 오픈됩니다.</p>
                <p class="ticket-info" th:text="|${ticketOpenMessage.description}|"></p>
                <hr/>
                <p>공연의 더 많은 정보와 좌석 정보를 확인하시려면 웹사이트를 방문해 주세요.</p>
            </td>
        </tr>
        <tr>
            <td class="footer">
                © 2024 Kuback Company, All rights reserved.
            </td>
        </tr>
    </table>
</div>
</body>
</html>
